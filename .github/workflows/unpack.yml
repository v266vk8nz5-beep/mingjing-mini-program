name: Unpack Mingjing
on:
  push:
    paths:
      - '.unpack-ready'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack project
        shell: bash
        run: |
          cat .upload/part-* > /tmp/mingjing.b64
          base64 -d /tmp/mingjing.b64 > /tmp/mingjing.zip
          unzip -o /tmp/mingjing.zip -d .
          rm -rf .upload .unpack-ready .init .github/workflows/unpack.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Upload Mingjing mini program'
          git push
